name: Append Rainfall Row To CSV
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch_and_append:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout full repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Install dependencies
        run: pip install requests lxml

      - name: Parse XML & append new row to CSV
        run: |
          python3 << 'EOF'
          import requests
          import hashlib
          import os
          import csv
          from lxml import etree

          URL = "https://xml.smg.gov.mo/p_actualweather.xml"
          CSV_FILE = "./rainfall_history.csv"
          HASH_FILE = "./last_xml_hash.txt"

          # 拉取原始XML
          resp = requests.get(URL, timeout=30)
          resp.raise_for_status()
          xml_content = resp.text
          new_hash = hashlib.md5(xml_content.encode("utf-8")).hexdigest()

          # 哈希比对，无更新直接退出
          old_hash = ""
          if os.path.exists(HASH_FILE):
              with open(HASH_FILE, "r", encoding="utf-8") as f:
                  old_hash = f.read().strip()
          if new_hash == old_hash:
              with open("update_flag", "w") as f:
                  f.write("0")
              exit()

          # 解析XML，增加空值保护，修复None.strip()报错
          tree = etree.fromstring(xml_content.encode("utf-8"))
          obs_time_raw = tree.findtext(".//ObsTime")
          obs_time = obs_time_raw.strip() if obs_time_raw is not None else ""

          # 站点-雨量字典，只提取Type=4雨量
          station_rain = {}
          for station in tree.xpath(".//Station"):
              st_name_raw = station.findtext("StationName", default="")
              st_name = st_name_raw.strip() if st_name_raw is not None else ""
              rain4 = "0.0"
              for data_node in station.xpath("Data"):
                  t = data_node.findtext("Type")
                  if t == "4":
                      val = data_node.findtext("dValue", default="0.0")
                      rain4 = val.strip() if val is not None else "0.0"
                      break
              station_rain[st_name] = rain4

          # 固定表头，和你的Excel截图列顺序、列名1:1匹配
          header = [
              "日期時間",
              "路環市區(毫米)",
              "大炮台山(毫米)",
              "紀念孫中山市政公園(毫米)",
              "澳門大學(毫米)",
              "海事博物館(毫米)",
              "外港碼頭(毫米)",
              "九澳(毫米)",
              "東亞運站(毫米)",
              "大潭山(毫米)",
              "澳門污水處理廠(毫米)"
          ]

          # 按固定站点顺序组装单行数据
          new_row = [obs_time]
          col_station_list = [
              "路環市區",
              "大炮台山",
              "紀念孫中山市政公園",
              "澳門大學",
              "海事博物館",
              "外港碼頭",
              "九澳",
              "東亞運站",
              "大潭山",
              "澳門污水處理廠"
          ]
          for s in col_station_list:
              new_row.append(station_rain.get(s, "0.0"))

          # 追加写入CSV：首次新建表头，后续只新增一行
          file_exists = os.path.exists(CSV_FILE)
          with open(CSV_FILE, "a", encoding="utf-8", newline="") as f:
              writer = csv.writer(f)
              if not file_exists:
                  writer.writerow(header)
              writer.writerow(new_row)

          # 更新哈希与更新标记
          with open(HASH_FILE, "w", encoding="utf-8") as f:
              f.write(new_hash)
          with open("update_flag", "w") as f:
              f.write("1")
          EOF

      - name: Git commit & push new line
        run: |
          FLAG=$(cat update_flag)
          if [ "$FLAG" != "1" ]; then
            echo "XML未更新，无需追加数据"
            exit 0
          fi

          git config --global user.name "macaosso"
          git config --global user.email "macaosso@users.noreply.github.com"

          git add rainfall_history.csv last_xml_hash.txt
          if git status --porcelain | grep -q .; then
            git commit -m "新增观测雨量行 $(date '+%Y-%m-%d %H:%M')"
            git push origin main
          fi
