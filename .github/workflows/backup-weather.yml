name: Auto Backup English Weather XML
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch_and_backup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout full repo + 绑定推送上游分支
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Install requests
        run: pip install requests

      - name: Run Python fetch logic
        run: |
          python3 << 'EOF'
          import requests
          import hashlib
          import os
          from datetime import datetime

          URL = "https://xml.smg.gov.mo/p_actualweather.xml"
          ARCHIVE_FOLDER = "./xml_archive_en"
          HASH_FILE = "./last_xml_hash.txt"
          os.makedirs(ARCHIVE_FOLDER, exist_ok=True)

          def get_md5(content):
              return hashlib.md5(content.encode("utf-8")).hexdigest()

          res = requests.get(URL, timeout=30)
          res.raise_for_status()
          xml_text = res.text
          new_hash = get_md5(xml_text)

          old_hash = ""
          if os.path.exists(HASH_FILE):
              with open(HASH_FILE, "r", encoding="utf-8") as f:
                  old_hash = f.read().strip()

          update_flag = "0"
          if new_hash != old_hash:
              ts = datetime.now().strftime("%Y%m%d_%H%M%S")
              fn = f"p_actualweather_{ts}.xml"
              save_path = os.path.join(ARCHIVE_FOLDER, fn)
              with open(save_path, "w", encoding="utf-8") as f:
                  f.write(xml_text)
              with open(HASH_FILE, "w", encoding="utf-8") as f:
                  f.write(new_hash)
              update_flag = "1"

          with open("update_flag", "w") as f:
              f.write(update_flag)
          EOF

      - name: Git commit & push (严格防128报错)
        run: |
          FLAG=$(cat update_flag)
          if [ "$FLAG" != "1" ]; then
            echo "No XML changes, exit successfully"
            exit 0
          fi

          # 固定提交者信息
          git config --global user.name "macaosso"
          git config --global user.email "macaosso@users.noreply.github.com"

          git add xml_archive_en/ last_xml_hash.txt
          # 检测是否有真实变更，无变更直接退出
          if git status --porcelain | grep -q .; then
            git commit -m "Auto update weather XML $(date '+%Y-%m-%d %H:%M')"
            git push origin main
          else
            echo "No actual file changes, skip commit"
          fi
